<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Dhukpr/GDA66BnLjC2MDYbkBL2GWAVNX5xHOPfJBvlk='; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>지원 전략 최초 설정 · 가상 테스트</title><link rel="stylesheet" href="strategy.css"><main><h1>가상 키 최초 설정 시험</h1><p>가상 테스트 전용입니다. 실제 비밀번호·개인정보 입력 금지. 공개 테스트 암호: PUBLIC SYNTHETIC fixture password 2026</p><p>한 번 설정하면 새 전략을 추가할 때 비밀번호를 다시 입력할 필요가 없습니다. 전략을 열 때는 이 브라우저에서 비밀번호로 잠금을 풉니다.</p><form id="setup-form"><label>새 비밀번호 (16자 이상)<input id="password" type="password" autocomplete="off" value="PUBLIC SYNTHETIC fixture password 2026"></label><label>비밀번호 확인<input id="password-again" type="password" autocomplete="off" value="PUBLIC SYNTHETIC fixture password 2026"></label><label><input id="consent" type="checkbox">내 브라우저에서 개인 키를 만들고 암호화된 복구 파일로 보관합니다. 비밀번호와 복구 파일을 잃으면 기존 문서를 복구할 수 없음을 확인했습니다.</label><button id="create">키 만들기</button></form><section id="ready" hidden><h2>복구 파일과 공개키</h2><p>복구 파일은 본인만 보관하세요. 비밀번호나 복구 파일을 대화창에 보내지 마세요. 아래 공개키 파일만 전달하면 됩니다.</p><button id="backup">암호화 복구 파일 받기</button><button id="public">공개키 파일 받기</button><label>공개키<textarea id="public-json" readonly></textarea></label><p>공개키 지문: <span id="fingerprint"></span></p><label><input id="backed-up" type="checkbox">복구 파일을 안전한 위치에 보관했습니다.</label><label><input id="remember" disabled type="checkbox">암호화된 복구 키를 이 브라우저에 저장합니다. 비밀번호는 저장하지 않습니다.</label><button id="save" disabled>이 브라우저에 저장</button></section><p id="status" role="status"></p></main><script type="module" src="setup.js" integrity="sha256-Dhukpr/GDA66BnLjC2MDYbkBL2GWAVNX5xHOPfJBvlk="></script></html>
